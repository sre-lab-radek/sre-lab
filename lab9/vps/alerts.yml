groups:
  - name: vps
    rules:
      - alert: VpsNoInternet
        expr: probe_success{instance="https://github.com"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "VPS cannot reach github.com"

      - alert: SreLabUnreachable
        # active only 08:00-22:00 UTC (09:00-23:00 CET), the PC is off at night
        expr: probe_success{instance="http://10.8.0.2:9090/-/healthy"} == 0 and on() (hour() >= 8 and hour() < 22)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "sre-lab is unreachable over the WireGuard tunnel"
