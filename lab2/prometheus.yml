global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: nodes
    static_configs:
      - targets:
          - "192.168.122.14:9100"
          - "192.168.122.175:9100"
          - "192.168.122.11:9100"