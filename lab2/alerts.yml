groups:
  - name: lab
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"

      - alert: WebBackendProbeFailing
        expr: probe_success{job="blackbox-http"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Backend {{ $labels.instance }} is failing HTTP probe"

      - alert: ServiceProbeFailing
        expr: probe_success{job="blackbox-lb"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Service via load balancer is failing HTTP probe"

  - name: slo
    rules:
      - record: sli:availability:ratio_6h
        expr: avg_over_time(probe_success{job="blackbox-lb"}[6h])

      - record: slo:error_budget_remaining:ratio_6h
        expr: 1 - (sum_over_time((1 - probe_success{job="blackbox-lb"})[6h:15s]) / 14.4)